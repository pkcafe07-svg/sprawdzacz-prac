          var customFetch = null;

          var fetchGetter = function() {
            return customFetch || (originalFetch ? (typeof originalFetch === 'function' ? originalFetch.bind(targetObj) : originalFetch) : undefined);
          };

              });
            } catch (_) {}

          try {
            Object.defineProperty(targetObj, 'fetch', {
              get: fetchGetter,

              configurable: true,

            });
          } catch (_) {}

          // Suppress unhandled getter errors from external iframe runners
          if (typeof window !== 'undefined' && window.addEventListener) {
            window.addEventListener('error', function(event) {
              if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
                if (typeof event.preventDefault === 'function') event.preventDefault();
                if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
                return true;
              }
            }, true);
          }
        } catch (_) {}
      })();
